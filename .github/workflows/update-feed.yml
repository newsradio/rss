name: Update RSS feed

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python generate_feed.py
      - name: Commit updated feed
        run: |
          git config user.name "NewsRadio RSS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet || git commit -m "Update RSS feed"
          git push
